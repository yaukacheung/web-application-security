<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 820 220" width="820" height="220" role="img" aria-label="Password Hashing and FIDO2 Verification Flow">
  <style>
    .box { fill: #f8fafc; stroke: #1e293b; stroke-width: 1.8; rx: 8; }
    .sec { fill: #eff6ff; stroke: #1d4ed8; stroke-width: 1.8; rx: 8; }
    .lbl { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; font-size: 12px; font-weight: 700; fill: #0f172a; text-anchor: middle; }
    .sub { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; font-size: 10.5px; fill: #334155; text-anchor: middle; }
    .arr { stroke: #334155; stroke-width: 2; fill: none; marker-end: url(#a20); }
  </style>
  <defs><marker id="a20" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M 0 1 L 10 5 L 0 9 z" fill="#334155"/></marker></defs>
  <rect width="820" height="220" fill="#ffffff"/>
  <text x="410" y="24" class="lbl" style="font-size:15px;">Figure 5.2: Salted Memory-Hard Password Verification and Origin-Bound MFA</text>

  <rect x="20" y="60" width="150" height="95" class="box"/>
  <text x="95" y="88" class="lbl">1. Login Input</text>
  <text x="95" y="108" class="sub">User password +</text>
  <text x="95" y="125" class="sub">per-user 16-byte salt</text>

  <rect x="205" y="60" width="175" height="95" class="sec"/>
  <text x="292" y="88" class="lbl">2. Memory-Hard KDF</text>
  <text x="292" y="108" class="sub">Argon2id / scrypt /</text>
  <text x="292" y="125" class="sub">PBKDF2-HMAC-SHA512</text>

  <rect x="415" y="60" width="175" height="95" class="sec"/>
  <text x="502" y="88" class="lbl">3. Constant-Time Check</text>
  <text x="502" y="108" class="sub">compare_digest /</text>
  <text x="502" y="125" class="sub">timingSafeEqual</text>

  <rect x="625" y="60" width="175" height="95" class="box"/>
  <text x="712" y="88" class="lbl">4. FIDO2 / WebAuthn</text>
  <text x="712" y="108" class="sub">Signed challenge bound</text>
  <text x="712" y="125" class="sub">to exact rpId origin</text>

  <line x1="170" y1="107" x2="202" y2="107" class="arr"/>
  <line x1="380" y1="107" x2="412" y2="107" class="arr"/>
  <line x1="590" y1="107" x2="622" y2="107" class="arr"/>

  <text x="410" y="190" class="sub">Generic login errors + progressive rate limits stop enumeration without creating account-lockout DoS.</text>
</svg>

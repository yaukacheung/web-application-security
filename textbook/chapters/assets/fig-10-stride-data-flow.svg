<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 820 250" width="820" height="250" role="img" aria-label="STRIDE Data-Flow Threat Model">
  <style>
    .box { fill: #f8fafc; stroke: #1e293b; stroke-width: 1.8; rx: 8; }
    .threat { fill: #fef2f2; stroke: #dc2626; stroke-width: 1.5; rx: 6; }
    .lbl { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; font-size: 12.5px; font-weight: 700; fill: #0f172a; text-anchor: middle; }
    .sub { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; font-size: 11px; fill: #334155; text-anchor: middle; }
    .tlbl { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; font-size: 11px; font-weight: 700; fill: #b91c1c; text-anchor: middle; }
    .arr { stroke: #334155; stroke-width: 2; fill: none; marker-end: url(#a10); }
  </style>
  <defs><marker id="a10" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M 0 1 L 10 5 L 0 9 z" fill="#334155"/></marker></defs>
  <rect width="820" height="250" fill="#ffffff"/>
  <text x="410" y="24" class="lbl" style="font-size:15px;">Figure 2.1: STRIDE Data-Flow Threat Model for a Checkout Request</text>

  <rect x="25" y="60" width="145" height="75" class="box"/>
  <text x="97" y="90" class="lbl">Browser Client</text>
  <text x="97" y="108" class="sub">POST /api/checkout</text>
  <text x="97" y="123" class="sub">cartId, couponCode</text>

  <rect x="225" y="60" width="160" height="75" class="box"/>
  <text x="305" y="90" class="lbl">API Gateway / Auth</text>
  <text x="305" y="108" class="sub">Verifies Session/JWT</text>
  <text x="305" y="123" class="sub">Enforces Role Policy</text>

  <rect x="440" y="60" width="165" height="75" class="box"/>
  <text x="522" y="90" class="lbl">Checkout Service</text>
  <text x="522" y="108" class="sub">Looks up server prices</text>
  <text x="522" y="123" class="sub">Checks cart ownership</text>

  <rect x="655" y="60" width="140" height="75" class="box"/>
  <text x="725" y="90" class="lbl">Orders &amp; Catalog DB</text>
  <text x="725" y="108" class="sub">Parameterized SQL</text>
  <text x="725" y="123" class="sub">Audit Log Store</text>

  <line x1="170" y1="97" x2="222" y2="97" class="arr"/>
  <line x1="385" y1="97" x2="437" y2="97" class="arr"/>
  <line x1="605" y1="97" x2="652" y2="97" class="arr"/>

  <rect x="25" y="158" width="180" height="62" class="threat"/>
  <text x="115" y="179" class="tlbl">S / T: Spoofing &amp; Tampering</text>
  <text x="115" y="196" class="sub">Forged session or negative qty</text>
  <text x="115" y="211" class="sub">Fix: Server session + qty &gt; 0</text>

  <rect x="225" y="158" width="185" height="62" class="threat"/>
  <text x="317" y="179" class="tlbl">E: Elevation of Privilege</text>
  <text x="317" y="196" class="sub">Calling /admin/refunds as user</text>
  <text x="317" y="211" class="sub">Fix: Deny-by-default RBAC</text>

  <rect x="430" y="158" width="185" height="62" class="threat"/>
  <text x="522" y="179" class="tlbl">I: Information Disclosure</text>
  <text x="522" y="196" class="sub">Reading another user's order</text>
  <text x="522" y="211" class="sub">Fix: Query scoped by owner_id</text>

  <rect x="630" y="158" width="165" height="62" class="threat"/>
  <text x="712" y="179" class="tlbl">R / D: Repudiation &amp; DoS</text>
  <text x="712" y="196" class="sub">Missing logs or batch abuse</text>
  <text x="712" y="211" class="sub">Fix: Audit logs + rate limits</text>
</svg>

<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 820 240" width="820" height="240" role="img" aria-label="String Concatenation vs Parameterized Query">
  <style>
    .bad { fill: #fef2f2; stroke: #dc2626; stroke-width: 1.8; rx: 8; }
    .good { fill: #f0fdf4; stroke: #16a34a; stroke-width: 1.8; rx: 8; }
    .box { fill: #ffffff; stroke: #334155; stroke-width: 1.5; rx: 6; }
    .lbl { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; font-size: 13px; font-weight: 700; fill: #0f172a; text-anchor: middle; }
    .sub { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; font-size: 11px; fill: #334155; text-anchor: middle; }
    .arr { stroke: #334155; stroke-width: 1.8; fill: none; marker-end: url(#a19); }
  </style>
  <defs><marker id="a19" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M 0 1 L 10 5 L 0 9 z" fill="#334155"/></marker></defs>
  <rect width="820" height="240" fill="#ffffff"/>
  <text x="410" y="24" class="lbl" style="font-size:15px;">Figure 3.2: Parser Confusion (String Concatenation) vs. Parameterized Queries</text>

  <!-- Vulnerable -->
  <rect x="20" y="45" width="780" height="82" class="bad"/>
  <text x="150" y="70" class="lbl" style="fill:#b91c1c;">Vulnerable: String Interpolation</text>
  <rect x="30" y="82" width="160" height="34" class="box"/>
  <text x="110" y="103" class="sub">Input: ' OR '1'='1</text>
  <line x1="190" y1="99" x2="230" y2="99" class="arr"/>
  <rect x="233" y="82" width="315" height="34" class="box"/>
  <text x="390" y="103" class="sub">SELECT ... WHERE user='' OR '1'='1'</text>
  <line x1="548" y1="99" x2="585" y2="99" class="arr"/>
  <rect x="588" y="82" width="195" height="34" class="box"/>
  <text x="685" y="103" class="sub" style="fill:#b91c1c;font-weight:700;">SQL Parser Executes Logic</text>

  <!-- Safe -->
  <rect x="20" y="140" width="780" height="82" class="good"/>
  <text x="155" y="165" class="lbl" style="fill:#15803d;">Secure: Parameterized Statement</text>
  <rect x="30" y="177" width="160" height="34" class="box"/>
  <text x="110" y="198" class="sub">Param: "' OR '1'='1"</text>
  <line x1="190" y1="194" x2="230" y2="194" class="arr"/>
  <rect x="233" y="177" width="315" height="34" class="box"/>
  <text x="390" y="198" class="sub">Compiled AST: SELECT ... WHERE user = ?</text>
  <line x1="548" y1="194" x2="585" y2="194" class="arr"/>
  <rect x="588" y="177" width="195" height="34" class="box"/>
  <text x="685" y="198" class="sub" style="fill:#15803d;font-weight:700;">Treated Strictly as Data</text>
</svg>

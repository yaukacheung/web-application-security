<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 820 230" width="820" height="230" role="img" aria-label="WAF vs. Centralized SIEM Detection">
  <style>
    .box { fill: #f8fafc; stroke: #1e293b; stroke-width: 1.8; rx: 8; }
    .siem { fill: #eff6ff; stroke: #1d4ed8; stroke-width: 1.8; rx: 8; }
    .lbl { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; font-size: 12.5px; font-weight: 700; fill: #0f172a; text-anchor: middle; }
    .sub { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; font-size: 11px; fill: #334155; text-anchor: middle; }
    .arr { stroke: #334155; stroke-width: 2; fill: none; marker-end: url(#a15); }
  </style>
  <defs><marker id="a15" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M 0 1 L 10 5 L 0 9 z" fill="#334155"/></marker></defs>
  <rect width="820" height="230" fill="#ffffff"/>
  <text x="410" y="24" class="lbl" style="font-size:15px;">Figure 13.1: Edge WAF Filtering vs. Structured Application Logging and SIEM</text>

  <rect x="20" y="65" width="145" height="95" class="box"/>
  <text x="92" y="95" class="lbl">Incoming Traffic</text>
  <text x="92" y="114" class="sub">Legitimate users +</text>
  <text x="92" y="131" class="sub">automated probes</text>

  <rect x="200" y="65" width="175" height="95" class="box"/>
  <text x="287" y="92" class="lbl">1. Edge WAF</text>
  <text x="287" y="111" class="sub">Blocks known SQLi/XSS</text>
  <text x="287" y="128" class="sub">signatures &amp; bot bursts</text>
  <text x="287" y="145" class="sub">(Cannot verify IDOR)</text>

  <rect x="410" y="65" width="185" height="95" class="box"/>
  <text x="502" y="92" class="lbl">2. Application Server</text>
  <text x="502" y="111" class="sub">Emits structured JSON</text>
  <text x="502" y="128" class="sub">+ correlation_id</text>
  <text x="502" y="145" class="sub">(Tokens/PII redacted)</text>

  <rect x="630" y="65" width="170" height="95" class="siem"/>
  <text x="715" y="92" class="lbl">3. Centralized SIEM</text>
  <text x="715" y="111" class="sub">Detects 401 bursts,</text>
  <text x="715" y="128" class="sub">sequential ID sweeps,</text>
  <text x="715" y="145" class="sub">and 500 error spikes</text>

  <line x1="165" y1="112" x2="197" y2="112" class="arr"/>
  <line x1="375" y1="112" x2="407" y2="112" class="arr"/>
  <line x1="595" y1="112" x2="627" y2="112" class="arr"/>

  <text x="410" y="195" class="sub">Store security logs off-host in append-only SIEM storage so compromised web servers cannot erase audit trails.</text>
</svg>

<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 820 260" width="820" height="260" role="img" aria-label="Web Application Stack and Trust Boundaries">
  <style>
    .box { fill: #f8fafc; stroke: #1e293b; stroke-width: 2; rx: 8; }
    .tb { stroke: #dc2626; stroke-width: 2; stroke-dasharray: 6,4; }
    .lbl { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; font-size: 13px; font-weight: 700; fill: #0f172a; text-anchor: middle; }
    .sub { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; font-size: 11px; fill: #475569; text-anchor: middle; }
    .tblbl { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; font-size: 11px; font-weight: 700; fill: #b91c1c; text-anchor: middle; }
    .arr { stroke: #334155; stroke-width: 2; fill: none; marker-end: url(#arrow); }
  </style>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1 L 10 5 L 0 9 z" fill="#334155"/>
    </marker>
  </defs>
  <rect width="820" height="260" fill="#ffffff"/>
  <text x="410" y="24" class="lbl" style="font-size:15px;">Figure 1.1: Web Application Architecture and Trust Boundaries</text>

  <rect x="20" y="75" width="135" height="80" class="box"/>
  <text x="87" y="108" class="lbl">Browser / Client</text>
  <text x="87" y="126" class="sub">DOM, JS, Cookies</text>
  <text x="87" y="142" class="sub">(User-Controlled)</text>

  <line x1="185" y1="50" x2="185" y2="195" class="tb"/>
  <text x="185" y="44" class="tblbl">TB1: Client / Edge</text>

  <rect x="215" y="75" width="145" height="80" class="box"/>
  <text x="287" y="108" class="lbl">Reverse Proxy / WAF</text>
  <text x="287" y="126" class="sub">TLS Termination</text>
  <text x="287" y="142" class="sub">Rate Limits &amp; Headers</text>

  <line x1="390" y1="50" x2="390" y2="195" class="tb"/>
  <text x="390" y="44" class="tblbl">TB2: App Entry</text>

  <rect x="420" y="75" width="155" height="80" class="box"/>
  <text x="497" y="108" class="lbl">Application Server</text>
  <text x="497" y="126" class="sub">AuthN, AuthZ, Validation</text>
  <text x="497" y="142" class="sub">Business Logic</text>

  <line x1="605" y1="50" x2="605" y2="195" class="tb"/>
  <text x="605" y="44" class="tblbl">TB3: Data / Egress</text>

  <rect x="635" y="55" width="160" height="60" class="box"/>
  <text x="715" y="82" class="lbl">Database / Store</text>
  <text x="715" y="99" class="sub">Parameterized Queries</text>

  <rect x="635" y="130" width="160" height="60" class="box"/>
  <text x="715" y="157" class="lbl">Internal / Partner APIs</text>
  <text x="715" y="174" class="sub">Egress Allow-Lists</text>

  <line x1="155" y1="115" x2="212" y2="115" class="arr"/>
  <line x1="360" y1="115" x2="417" y2="115" class="arr"/>
  <line x1="575" y1="100" x2="632" y2="85" class="arr"/>
  <line x1="575" y1="130" x2="632" y2="158" class="arr"/>

  <text x="410" y="232" class="sub">Untrusted data crossing TB1–TB3 must be validated, authorized, and parameterized on the server side.</text>
</svg>

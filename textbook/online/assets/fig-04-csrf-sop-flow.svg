<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 250" width="800" height="250" role="img" aria-label="Same-Origin Policy and CSRF Flow">
  <style>
    .box { fill: #f8fafc; stroke: #1e293b; stroke-width: 2; rx: 8; }
    .lbl { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; font-size: 13px; font-weight: 700; fill: #0f172a; text-anchor: middle; }
    .sub { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; font-size: 11px; fill: #475569; text-anchor: middle; }
    .ok { stroke: #16a34a; stroke-width: 2; fill: none; marker-end: url(#g); }
    .bad { stroke: #dc2626; stroke-width: 2; fill: none; marker-end: url(#r); }
  </style>
  <defs>
    <marker id="g" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M 0 1 L 10 5 L 0 9 z" fill="#16a34a"/></marker>
    <marker id="r" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M 0 1 L 10 5 L 0 9 z" fill="#dc2626"/></marker>
  </defs>
  <rect width="800" height="250" fill="#ffffff"/>
  <text x="400" y="24" class="lbl" style="font-size:15px;">Figure 8.1: Same-Origin Policy vs. CSRF Ambient Credentials</text>

  <rect x="30" y="65" width="180" height="120" class="box"/>
  <text x="120" y="95" class="lbl">Untrusted Tab</text>
  <text x="120" y="113" class="sub">Origin: other.example</text>
  <text x="120" y="135" class="sub">Hidden &lt;form&gt; POST</text>
  <text x="120" y="152" class="sub">or fetch() request</text>

  <rect x="310" y="65" width="180" height="120" class="box"/>
  <text x="400" y="95" class="lbl">Browser Cookie Jar</text>
  <text x="400" y="115" class="sub">Session cookie for</text>
  <text x="400" y="132" class="sub">app.example</text>
  <text x="400" y="155" class="sub" style="fill:#16a34a;font-weight:700;">SameSite=Lax blocks POST</text>

  <rect x="590" y="65" width="180" height="120" class="box"/>
  <text x="680" y="95" class="lbl">Target Server</text>
  <text x="680" y="113" class="sub">Origin: app.example</text>
  <text x="680" y="135" class="sub" style="fill:#16a34a;font-weight:700;">Verifies X-CSRF-Token</text>
  <text x="680" y="152" class="sub">&amp; Sec-Fetch-Site</text>

  <line x1="210" y1="100" x2="307" y2="100" class="bad"/>
  <text x="258" y="92" class="sub" style="fill:#dc2626;">Cross-site write</text>

  <line x1="490" y1="100" x2="587" y2="100" class="ok"/>
  <text x="538" y="92" class="sub" style="fill:#16a34a;">Token check</text>

  <path d="M 590 155 Q 400 220 210 155" class="ok" stroke-dasharray="5,4"/>
  <text x="400" y="212" class="sub" style="fill:#16a34a;font-weight:600;">SOP blocks other.example from reading responses or CSRF tokens</text>
</svg>

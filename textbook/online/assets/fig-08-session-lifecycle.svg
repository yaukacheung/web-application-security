<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 820 220" width="820" height="220" role="img" aria-label="Secure Session Lifecycle and Cookie Hardening">
  <style>
    .box { fill: #f8fafc; stroke: #1e293b; stroke-width: 2; rx: 8; }
    .sec { fill: #eff6ff; stroke: #1d4ed8; stroke-width: 2; rx: 8; }
    .lbl { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; font-size: 12.5px; font-weight: 700; fill: #0f172a; text-anchor: middle; }
    .sub { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; font-size: 11px; fill: #334155; text-anchor: middle; }
    .arr { stroke: #334155; stroke-width: 2; fill: none; marker-end: url(#ar6); }
  </style>
  <defs><marker id="ar6" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M 0 1 L 10 5 L 0 9 z" fill="#334155"/></marker></defs>
  <rect width="820" height="220" fill="#ffffff"/>
  <text x="410" y="24" class="lbl" style="font-size:15px;">Figure 6.1: Secure Session Lifecycle and Fixation Prevention</text>

  <rect x="20" y="58" width="170" height="105" class="box"/>
  <text x="105" y="84" class="lbl">1. Pre-Auth</text>
  <text x="105" y="104" class="sub">Anonymous / Login Form</text>
  <text x="105" y="122" class="sub">Pre-login SID may exist</text>
  <text x="105" y="140" class="sub">(Untrusted if fixed)</text>

  <rect x="220" y="58" width="185" height="105" class="sec"/>
  <text x="312" y="84" class="lbl">2. Auth &amp; Regenerate</text>
  <text x="312" y="104" class="sub">Discard pre-login SID</text>
  <text x="312" y="122" class="sub">Issue 128-bit+ CSPRNG ID</text>
  <text x="312" y="140" class="sub">Stops Session Fixation</text>

  <rect x="435" y="58" width="180" height="105" class="sec"/>
  <text x="525" y="84" class="lbl">3. Active Transport</text>
  <text x="525" y="104" class="sub">__Host-sid; Path=/</text>
  <text x="525" y="122" class="sub">Secure; HttpOnly</text>
  <text x="525" y="140" class="sub">SameSite=Lax</text>

  <rect x="645" y="58" width="155" height="105" class="box"/>
  <text x="722" y="84" class="lbl">4. Termination</text>
  <text x="722" y="104" class="sub">Idle &amp; Absolute Timeouts</text>
  <text x="722" y="122" class="sub">Delete Server Store</text>
  <text x="722" y="140" class="sub">Clear Browser Cookie</text>

  <line x1="190" y1="110" x2="217" y2="110" class="arr"/>
  <line x1="405" y1="110" x2="432" y2="110" class="arr"/>
  <line x1="615" y1="110" x2="642" y2="110" class="arr"/>

  <text x="410" y="196" class="sub">Regenerate the session identifier on every login or privilege elevation, and invalidate server-side state on logout.</text>
</svg>

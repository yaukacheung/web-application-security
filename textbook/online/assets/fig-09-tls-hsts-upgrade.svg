<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 240" width="800" height="240" role="img" aria-label="SSL Stripping vs. HSTS Protection">
  <style>
    .box { fill: #f8fafc; stroke: #1e293b; stroke-width: 1.8; rx: 8; }
    .lbl { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; font-size: 13px; font-weight: 700; fill: #0f172a; text-anchor: middle; }
    .sub { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; font-size: 11px; fill: #334155; text-anchor: middle; }
    .bad { stroke: #dc2626; stroke-width: 2; fill: none; marker-end: url(#r16); }
    .ok { stroke: #16a34a; stroke-width: 2; fill: none; marker-end: url(#g16); }
  </style>
  <defs>
    <marker id="r16" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M 0 1 L 10 5 L 0 9 z" fill="#dc2626"/></marker>
    <marker id="g16" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M 0 1 L 10 5 L 0 9 z" fill="#16a34a"/></marker>
  </defs>
  <rect width="800" height="240" fill="#ffffff"/>
  <text x="400" y="24" class="lbl" style="font-size:15px;">Figure 16.1: Redirect-Only Downgrade Risk vs. HSTS Browser Upgrade</text>

  <!-- Row 1: Without HSTS -->
  <rect x="30" y="48" width="160" height="62" class="box"/>
  <text x="110" y="75" class="lbl">Browser (No HSTS)</text>
  <text x="110" y="93" class="sub">User types example.com</text>

  <rect x="315" y="48" width="170" height="62" class="box" style="stroke:#dc2626;"/>
  <text x="400" y="75" class="lbl" style="fill:#b91c1c;">On-Path Attacker</text>
  <text x="400" y="93" class="sub">Intercepts plain HTTP; strips TLS</text>

  <rect x="610" y="48" width="160" height="62" class="box"/>
  <text x="690" y="75" class="lbl">Origin Server</text>
  <text x="690" y="93" class="sub">301 Redirect -&gt; HTTPS</text>

  <line x1="190" y1="79" x2="312" y2="79" class="bad"/>
  <text x="251" y="71" class="sub" style="fill:#dc2626;">GET http://</text>
  <line x1="485" y1="79" x2="607" y2="79" class="bad"/>
  <text x="546" y="71" class="sub" style="fill:#dc2626;">Proxies HTTPS</text>

  <!-- Row 2: With HSTS -->
  <rect x="30" y="142" width="160" height="68" class="box" style="stroke:#16a34a;"/>
  <text x="110" y="168" class="lbl">Browser (HSTS Cached)</text>
  <text x="110" y="186" class="sub">Upgrades locally to HTTPS</text>
  <text x="110" y="201" class="sub">before any packet leaves</text>

  <rect x="610" y="142" width="160" height="68" class="box" style="stroke:#16a34a;"/>
  <text x="690" y="168" class="lbl">Origin Server (TLS 1.3)</text>
  <text x="690" y="186" class="sub">Strict-Transport-Security:</text>
  <text x="690" y="201" class="sub">max-age=31536000</text>

  <line x1="190" y1="176" x2="607" y2="176" class="ok"/>
  <text x="400" y="168" class="sub" style="fill:#16a34a;font-weight:700;">Direct Encrypted TLS 1.3 Connection (No Cleartext Request Sent)</text>
</svg>

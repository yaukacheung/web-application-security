<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 820 220" width="820" height="220" role="img" aria-label="Secure SDLC CI/CD Security Gates">
  <style>
    .box { fill: #f8fafc; stroke: #1e293b; stroke-width: 1.8; rx: 8; }
    .gate { fill: #eff6ff; stroke: #1d4ed8; stroke-width: 1.8; rx: 8; }
    .lbl { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; font-size: 12px; font-weight: 700; fill: #0f172a; text-anchor: middle; }
    .sub { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; font-size: 10.5px; fill: #334155; text-anchor: middle; }
    .arr { stroke: #334155; stroke-width: 2; fill: none; marker-end: url(#a14); }
  </style>
  <defs><marker id="a14" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M 0 1 L 10 5 L 0 9 z" fill="#334155"/></marker></defs>
  <rect width="820" height="220" fill="#ffffff"/>
  <text x="410" y="24" class="lbl" style="font-size:15px;">Figure 12.1: Secure SDLC Gates in a Hardened CI/CD Pipeline (NIST SSDF)</text>

  <rect x="20" y="62" width="135" height="90" class="box"/>
  <text x="87" y="88" class="lbl">1. Code &amp; PR</text>
  <text x="87" y="108" class="sub">Threat model review</text>
  <text x="87" y="125" class="sub">Committed lockfiles</text>
  <text x="87" y="141" class="sub">Branch protection</text>

  <rect x="180" y="62" width="140" height="90" class="gate"/>
  <text x="250" y="88" class="lbl">2. Secret &amp; SAST</text>
  <text x="250" y="108" class="sub">Block leaked keys</text>
  <text x="250" y="125" class="sub">Scan AST/data flows</text>
  <text x="250" y="141" class="sub">for injection sinks</text>

  <rect x="345" y="62" width="140" height="90" class="gate"/>
  <text x="415" y="88" class="lbl">3. SCA &amp; SBOM</text>
  <text x="415" y="108" class="sub">Check CVEs in direct</text>
  <text x="415" y="125" class="sub">&amp; transitive deps</text>
  <text x="415" y="141" class="sub">Emit CycloneDX/SPDX</text>

  <rect x="510" y="62" width="140" height="90" class="gate"/>
  <text x="580" y="88" class="lbl">4. DAST &amp; Tests</text>
  <text x="580" y="108" class="sub">AuthZ regression tests</text>
  <text x="580" y="125" class="sub">HTTP header checks</text>
  <text x="580" y="141" class="sub">against staging app</text>

  <rect x="675" y="62" width="125" height="90" class="box"/>
  <text x="737" y="88" class="lbl">5. Signed Release</text>
  <text x="737" y="108" class="sub">SHA-pinned Actions</text>
  <text x="737" y="125" class="sub">Minimal CI token</text>
  <text x="737" y="141" class="sub">Artifact signing</text>

  <line x1="155" y1="107" x2="177" y2="107" class="arr"/>
  <line x1="320" y1="107" x2="342" y2="107" class="arr"/>
  <line x1="485" y1="107" x2="507" y2="107" class="arr"/>
  <line x1="650" y1="107" x2="672" y2="107" class="arr"/>

  <text x="410" y="188" class="sub">Automated gates catch syntax, secrets, and known CVEs early; manual review catches business-logic and AuthZ flaws.</text>
</svg>
